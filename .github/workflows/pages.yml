name: Browser Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize main runs so deployments cannot overtake each other. PRs are separate
# and can cancel superseded validation without interrupting publication.
concurrency:
  group: browser-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Verify all registered fixtures
        run: python3 scripts/ci-time.py fixtures sh scripts/check-fixtures.sh
      - name: Check Rust
        run: |
          python3 scripts/ci-time.py fmt cargo fmt --check
          python3 scripts/ci-time.py native-build cargo build --locked
          python3 scripts/ci-time.py native-tests cargo test --locked
          python3 scripts/ci-time.py native-clippy cargo clippy --locked --all-targets -- -D warnings

  build:
    # Playwright 1.58.2 supports Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Build browser client
        run: |
          python3 scripts/ci-time.py bindgen cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python3 scripts/ci-time.py wasm-build sh scripts/build-web.sh
          python3 scripts/ci-time.py wasm-clippy cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate static assets and browser at /saturn-rust/
        run: |
          python3 scripts/ci-time.py npm-install npm ci --ignore-scripts
          python3 scripts/ci-time.py chromium-install npx playwright install --with-deps chromium
          python3 scripts/ci-time.py runner-tests node --test scripts/ci-runner.test.mjs
          python3 scripts/ci-time.py browser npm run test:browser
      - name: Retain the tested web build
        uses: actions/upload-artifact@v4
        with:
          name: validated-web
          path: web
          if-no-files-found: error

  site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-web
          path: web
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Serialization prevents overlapping deployments; reject old reruns too.
      - name: Check that this revision is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded revision; rerun the latest main workflow to publish.'
          fi
      - name: Configure Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
