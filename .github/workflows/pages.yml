name: Browser Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize main runs so deployments cannot overtake each other. PRs are separate
# and can cancel superseded validation without interrupting publication.
concurrency:
  group: browser-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Verify all registered fixtures
        run: python3 scripts/ci-time.py fixtures sh scripts/check-fixtures.sh
      - name: Check Rust
        run: |
          python3 scripts/ci-time.py fmt cargo fmt --check
          python3 scripts/ci-time.py native-build cargo build --locked
          python3 scripts/ci-time.py native-tests cargo test --locked
          python3 scripts/ci-time.py native-clippy cargo clippy --locked --all-targets -- -D warnings

  wasm:
    # Playwright 1.58.2 supports Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Restore the pinned wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-ubuntu24-${{ runner.os }}-${{ runner.arch }}-0.2.129
      - name: Install the pinned wasm-bindgen CLI on a cold cache
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci-time.py bindgen cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build browser client
        run: |
          python3 scripts/ci-time.py wasm-build sh scripts/build-web.sh
          python3 scripts/ci-time.py wasm-clippy cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Retain the exact browser build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web
          if-no-files-found: error

  browser:
    needs: wasm
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [shared, scenarios]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Chromium
        run: |
          python3 scripts/ci-time.py npm-install npm ci --ignore-scripts
          python3 scripts/ci-time.py chromium-install npx playwright install --with-deps chromium
      - name: Validate runner failure propagation and publication gates
        if: matrix.shard == 'shared'
        run: python3 scripts/ci-time.py runner-tests node --test scripts/ci-runner.test.mjs
      - name: Validate browser shard at /saturn-rust/
        run: python3 scripts/ci-time.py browser-${{ matrix.shard }} npm run test:browser -- --shard=${{ matrix.shard }} --report=target/browser-results/${{ matrix.shard }}.json
      - name: Retain successful shard coverage and tested-artifact digest
        uses: actions/upload-artifact@v4
        with:
          name: browser-result-${{ matrix.shard }}
          path: target/browser-results/${{ matrix.shard }}.json
          if-no-files-found: error

  build:
    # Keep the existing required build status meaningful even when a dependency
    # fails/skips: do not let GitHub report a skipped final gate as a green check.
    if: always()
    needs: [native, wasm, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to succeed
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          printf 'Required jobs: native=%s wasm=%s browser=%s\n' "$NATIVE_RESULT" "$WASM_RESULT" "$BROWSER_RESULT"
          test "$NATIVE_RESULT" = success
          test "$WASM_RESULT" = success
          test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-result-*
          merge-multiple: true
          path: target/browser-results
      - name: Require all groups from this revision and this exact artifact
        run: node scripts/browser-suite.mjs --verify target/browser-results

  site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, wasm, browser, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Serialization prevents overlapping deployments; reject old reruns too.
      - name: Check that this revision is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded revision; rerun the latest main workflow to publish.'
          fi
      - name: Configure Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
