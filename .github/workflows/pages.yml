name: Browser Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize main runs so deployments cannot overtake each other. PRs are separate
# and can cancel superseded validation without interrupting publication.
concurrency:
  group: browser-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Verify reproducible homebrew image
        run: |
          python3 homebrew/star-collector/build.py --check
          python3 homebrew/prism-courier/build.py --check
          python3 tests/fixtures/build_dual_sh2.py --check
          python3 tests/fixtures/build_sh7604.py --check
          python3 tests/fixtures/build_bsc.py --check
          python3 tests/fixtures/build_tiles.py --check
          python3 tests/fixtures/build_effects.py --check
          python3 tests/fixtures/build_scu.py --check
          python3 tests/fixtures/build_sound.py --check
          python3 tests/fixtures/build_smpc.py --check
          python3 tests/fixtures/build_controller.py --check
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo build --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build browser client
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          sh scripts/build-web.sh
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate static assets and browser at /saturn-rust/
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Upload validated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Serialization prevents overlapping deployments; reject old reruns too.
      - name: Check that this revision is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded revision; rerun the latest main workflow to publish.'
          fi
      - name: Configure Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
