[package]
name = "saturn-rust"
version = "0.1.0"
edition = "2024"
description = "An original SH-2 interpreter and browser Saturn bootstrap prototype"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Pure Rust CD decoding on native and Wasm; retain raw sectors/subcode and CRC.
chd = { version = "=0.4.0", default-features = false, features = ["std", "cd_full", "verify_block_crc", "nonstandard_channel_count"] }

sha1 = "=0.10.6"
# Validate CD FLAC frame channel/bit-depth invariants before upstream decoding.
claxon = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

# Hardware guests advance millions of emulated clocks. Optimize their execution
# while retaining the development-time checks throughout the test profile.
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
